name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Ferramentas
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.14.0 mypy numpy==1.26.4 PyYAML==6.0.3 scipy==1.17.1 scikit-learn==1.9.1
      - name: Ruff (lint)
        run: ruff check src scripts tests empacotamento
      - name: Ruff (formatacao)
        run: ruff format --check src scripts tests empacotamento
      - name: Mypy
        run: mypy

  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bibliotecas do sistema (Qt offscreen, OpenCV)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-noto-core
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov
          python -m pip check
      - name: Testes
        run: python -m pytest --cov --cov-report=term --cov-report=xml -q
      - name: Resumo de cobertura
        if: always() && hashFiles('coverage.xml') != ''
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"### Cobertura ({'${{ matrix.os }}'}): {float(r.get('line-rate')) * 100:.1f}% das linhas")
          PY
